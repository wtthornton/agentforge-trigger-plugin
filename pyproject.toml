[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentforge-trigger-plugin"
version = "1.0.0"
description = "Test rig for AgentForge scheduler/trigger — job submit, cancel, lifecycle."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.0",
]

[project.entry-points."agentforge.plugins"]
trigger-test = "agentforge_trigger"

[tool.hatch.build.targets.wheel]
packages = ["agentforge_trigger"]

[tool.hatch.build.targets.wheel.force-include]
"agentforge_trigger/plugin.json" = "agentforge_trigger/plugin.json"
"agentforge_trigger/agents/trigger_test_agent/AGENT.md" = "agentforge_trigger/agents/trigger_test_agent/AGENT.md"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "httpx>=0.28",
]
